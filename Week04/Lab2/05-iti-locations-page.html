<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>profile</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        font-family: Arial;
      }

      ul {
        display: flex;
        min-height: 10vh;
        align-items: center;
        justify-content: space-evenly;
      }
      ul > li {
        list-style: none;
      }
      ul > li > a {
        text-decoration: none;
        color: brown;
        font-weight: bold;
      }
      ul > li > a:hover {
        color: lightcoral;
      }
      .intro {
        width: 100%;
        height: 90vh;
        background-image: url(laptop-hero-bg.jpg);
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }
      .intro h4 {
        font-size: 3rem;
        margin-bottom: 1.2rem;
      }
      .intro > button {
        padding: 1.2rem 2rem;
        outline: none;
        border-radius: 1rem;
        background-color: brown;
        color: aliceblue;
      }
      .intro > button:hover {
        background-color: burlywood;
        color: black;
      }

      #locations {
        width: auto;
        margin: 10px 0 10px auto;
        text-align: center;
        min-height: auto;
      }
      #locations h2 {
        color: rgb(101, 17, 15);
        font-family: Impact;
      }
      #locations p {
        color: gray;
        margin-top: 10px;
      }
      #content {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 20px;
        margin-top: 40px;
        flex-wrap: wrap;
      }

      #content img {
        width: 100%;
        max-width: 350px;
        height: auto;
      }
      #btns {
        flex: 1;
        max-width: 600px;
        text-align: left;
      }
      #btnlocations {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 15px;
      }

      .loc {
        text-align: left;
        width: 48%;
        padding: 10px 0 30px 10px;
        background-color: rgb(245, 245, 245);
        border: none;
        border-radius: 2px;
        color: black;
      }

      #mainloc {
        text-align: left;
        width: 48%;
        padding: 10px 0 30px 10px;
        background-color: rgb(245, 245, 245);
        border: none;
        border-radius: 2px;
      }
      #editcolor input {
        border: none;
        width: 20px;
        height: 20px;
        background-color: white;
        border-radius: 5px;
        margin: 10px;
      }
      #editcolor #mainbranch {
        background-color: rgb(101, 17, 15);
      }
      #editcolor #mbranch {
        background-color: rgb(42, 69, 87);
      }

      footer {
        background-color: rgb(32, 35, 42);
        min-height: 20vh;
      }
      #footer {
        display: flex;
        color: white;
        justify-content: space-between;
        align-items: flex-start;
        padding: 40px 10vw;
      }
      .footercontact {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .footercontact h3 {
        margin-bottom: 10px;
      }
      .footercontact p {
        line-height: 2;
      }

      #social {
        display: flex;
        gap: 25px;
        text-decoration: none;
        justify-content: center;
        flex-wrap: wrap;
      }
      #social a {
        text-decoration: none;
        background-color: aliceblue;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @media (max-width: 700px) {
        #content img {
          align-self: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About </a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="#">Gallery</a></li>
    </ul>
    <section class="intro">
      <h4>React Group</h4>
      <button>Register</button>
    </section>

    <div id="locations">
      <h2>ITI Location</h2>
      <p>ITI Main Locations all over the country</p>
      <div id="content">
        <img src="iti-map.png" />
        <div id="btns">
          <div id="btnlocations">
            <input type="button" value="🚩ITI-Smart Village" id="mainloc" />
            <input type="button" class="loc" value="🚩ITI-Assuit" />

            <input type="button" class="loc" value="🚩ITI-Ismailia" />
            <input type="button" class="loc" value="🚩ITI-Menofia" />

            <input type="button" class="loc" value="🚩ITI-Alexandria" />

            <input type="button" class="loc" value="🚩ITI-Aswan" />

            <input type="button" class="loc" value="🚩ITI-Mansoura" />
            <input type="button" class="loc" value="🚩ITI-Minya" />
            <div id="editcolor">
              <input type="button" id="mainbranch" />Main branch
              <input type="button" id="mbranch" />Branch
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <div id="footer">
        <div class="footercontact">
          <h3>Contact Us</h3>
          <p>
            🏴󠁥󠁣󠁸󠁿 28 Km by Cairo / Alexandria Desert Road, 6 October, B148,
            Egypt
          </p>
          <p>📞 (+202) 353-55656</p>
          <p>📧 ITIinfo@iti.gov.eg</p>
        </div>
        <div class="footercontact">
          <h3>Follow Us</h3>
          <div id="social">
            <a href="#" target="_blank">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                x="0px"
                y="0px"

                <path
                  fill="#039be5"
                  d="M24 5A19 19 0 1 0 24 43A19 19 0 1 0 24 5Z"
                ></path>
                <path
                  fill="#fff"
                  d="M26.572,29.036h4.917l0.772-4.995h-5.69v-2.73c0-2.075,0.678-3.915,2.619-3.915h3.119v-4.359c-0.548-0.074-1.707-0.236-3.897-0.236c-4.573,0-7.254,2.415-7.254,7.917v3.323h-4.701v4.995h4.701v13.729C22.089,42.905,23.032,43,24,43c0.875,0,1.729-0.08,2.572-0.194V29.036z"

            <a href="#" target="_blank">
              <svg

                x="0px"
                y="0px"
                width="100"
                height="100"
                viewBox="0 0 48 48"
              >
                <path
                  fill="#03a9f4"
                  d="M24 4A20 20 0 1 0 24 44A20 20 0 1 0 24 4Z"
                ></path>
                <path
                  fill="#fff"
                  d="M36,17.12c-0.882,0.391-1.999,0.758-3,0.88c1.018-0.604,2.633-1.862,3-3 c-0.951,0.559-2.671,1.156-3.793,1.372C31.311,15.422,30.033,15,28.617,15C25.897,15,24,17.305,24,20v2c-4,0-7.9-3.047-10.327-6 c-0.427,0.721-0.667,1.565-0.667,2.457c0,1.819,1.671,3.665,2.994,4.543c-0.807-0.025-2.335-0.641-3-1c0,0.016,0,0.036,0,0.057 c0,2.367,1.661,3.974,3.912,4.422C16.501,26.592,16,27,14.072,27c0.626,1.935,3.773,2.958,5.928,3c-1.686,1.307-4.692,2-7,2 c-0.399,0-0.615,0.022-1-0.023C14.178,33.357,17.22,34,20,34c9.057,0,14-6.918,14-13.37c0-0.212-0.007-0.922-0.018-1.13 C34.95,18.818,35.342,18.104,36,17.12"
                ></path>
              </svg>
            </a>
            <a href="#" target="_blank">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                x="0px"
                y="0px"
                width="100"
                height="100"
                viewBox="0 0 48 48"
              >
                <path
                  fill="#FF3D00"
                  d="M43.2,33.9c-0.4,2.1-2.1,3.7-4.2,4c-3.3,0.5-8.8,1.1-15,1.1c-6.1,0-11.6-0.6-15-1.1c-2.1-0.3-3.8-1.9-4.2-4C4.4,31.6,4,28.2,4,24c0-4.2,0.4-7.6,0.8-9.9c0.4-2.1,2.1-3.7,4.2-4C12.3,9.6,17.8,9,24,9c6.2,0,11.6,0.6,15,1.1c2.1,0.3,3.8,1.9,4.2,4c0.4,2.3,0.9,5.7,0.9,9.9C44,28.2,43.6,31.6,43.2,33.9z"
                ></path>
                <path fill="#FFF" d="M20 31L20 17 32 24z"></path>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </footer>

    <script>
      const maincolor = document.getElementById("mainbranch");
      const bracolor = document.getElementById("mbranch");
      const mloc = document.getElementById("mainloc");
      const branloc = document.querySelectorAll(".loc");
      maincolor.addEventListener("click", function () {
        mloc.style.color = " rgb(101, 17, 15)";
        mloc.style.boxShadow = "5px 5px 5px rgba(101, 17, 15,0.3)";
      });
      bracolor.addEventListener("click", function () {
        branloc.forEach((e) => {
          e.style.color = "blue";
        });
      });
    </script>
  </body>
</html>
