<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INK</title>
  </head>
  <style>
    * {
      padding: 0;
      border: 0;
      box-sizing: border-box;
    }
    #container {
      width: 100vw;
      height: auto;
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "footer nav "
        "footer content";
    }

    nav {
      grid-area: nav;
      background-color: rgb(205, 184, 129);
      height: 60px;
      display: flex;
      align-items: center;
    }
    ul {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
      margin-left: 10px;
    }
    ul li:first-child {
      font-size: 15px;
      background-color: rgb(183, 166, 114);
      padding: 5px 10px;
      text-align: center;
      align-self: center;
      border-radius: 3px;
    }

    #content {
      grid-area: content;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-rows: auto;
    }
    #content img {
      width: 100%;
      height: 100%;
    }

    footer {
      grid-area: footer;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    footer > h2 {
      font-size: 100px;
      font-weight: bold;
      margin: 0;
    }

    #social {
      margin-left: 20px;
      display: flex;
      gap: 15px;
    }
    #social a {
      text-decoration: none;
      background-color: lightslategray;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #flickphoto {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }
    #flickphoto img {
      width: 100%;
      height: auto;
    }

    @media (max-width: 800px) {
      #content {
        grid-template-columns: 1fr 1fr;
      }
      footer {
        gap: 50px;
      }
    }

    @media (max-width: 400px) {
      #container {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        grid-template-areas:
          "nav "
          "content"
          "footer";
      }
      #content {
        grid-template-columns: 1fr;
      }
      nav {
        padding: 10px;
      }
      footer {
        text-align: center;
        gap: 10px;
      }
      #social {
        margin: 10px auto;
      }
    }
  </style>
  <body>
    <div id="container">
      <nav>
        <ul>
          <li>All</li>
          <li>Illustration</li>
          <li>Motion</li>
          <li>Photography</li>
          <li>Print</li>
        </ul>
      </nav>
      <section id="content">
        <img src="screenshot01.png" alt="" />
        <img src="screenshot02.png" alt="" />
        <img src="screenshot03.png" alt="" />
        <img src="screenshot04.png" alt="" />
        <img src="screenshot05.png" alt="" />
        <img src="screenshot06.png" alt="" />
        <img src="screenshot07.png" alt="" />
        <img src="screenshot08.png" alt="" />
        <img src="screenshot09.png" alt="" />
        <img src="screenshot10.png" alt="" />
        <img src="screenshot11.png" alt="" />
        <img src="screenshot12.png" alt="" />
      </section>

      <footer>
        <h2>INK</h2>

        <h3>Portfolio</h3>
        <p>About us</p>
        <p>Blog</p>
        <p>Buy This Theme</p>

        <div id="social">
          <a href="">F</a>
          <a href="">X</a>
          <a href="">Y</a>
        </div>
        <h4>A Text Widget</h4>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam animi
          ut incidunt culpa odio!
        </p>

        <h5>Flickers</h5>
        <div id="flickphoto">
          <img src="screenshot06.png" alt="" />
          <img src="screenshot09.png" alt="" />
          <img src="screenshot01.png" alt="" />
          <img src="screenshot06.png" alt="" />
          <img src="screenshot09.png" alt="" />
          <img src="screenshot01.png" alt="" />
        </div>
      </footer>
    </div>
  </body>
</html>
