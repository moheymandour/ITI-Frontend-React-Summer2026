<html>
  <head>
    <title>Forms</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }
      #container {
        height: 700px;
        margin: 50px auto;
        position: relative;
      }

      .main {
        height: 200px;
      }
/* ==================================================================== */
      .title1,
      .form1,
      #logo1,
      #but1 {
        display: inline-block;
      }
      #header1 #logo1 {
        position: absolute;
        top: 50;
        left: 30;
      }
      #header1 .title1 {
        position: absolute;
        top: 80;
        left: 150;
        color: lightblue;
        font-style: bold;
      }

      #header1 .form1 {
        position: absolute;
        top: 110;
        left: 150;
        color: black;
        font-size: 16;
      }

      #header1 #but1 {
        position: absolute;
        top: 70;
        right: 50;
      }

      button {
        padding: 10px 20px;
        border: none;
      }
/* ======================================================================= */
      .title2,
      .form2,
      #logo2,
      #but2 {
        display: inline-block;
      }
      #header2 #logo2 {
        position: absolute;
        top: 250;
        left: 30;
      }
      #header2 .title2 {
        position: absolute;
        top: 280;
        left: 150;
        color: lightblue;
        font-style: bold;
      }

      #header2 .form2 {
        position: absolute;
        top: 310;
        left: 150;
        color: black;
        font-size: 16;
      }

      #header2 #but2 {
        position: absolute;
        top: 260;
        right: 50;
      }
/* ============================================================== */
      .title3,
      .form3,
      #logo3,
      #but3 {
        display: inline-block;
      }
      #header3 #logo3 {
        position: absolute;
        top: 500;
        left: 30;
      }
      #header3 .title3 {
        position: absolute;
        top: 530;
        left: 150;
        color: lightblue;
        font-style: bold;
      }

      #header3 .form3 {
        position: absolute;
        top: 560;
        left: 150;
        color: black;
        font-size: 16;
      }

      #header3 #but3 {
        position: absolute;
        top: 510;
        right: 50;
      }

    </style>
  </head>
  <!-- ================================================================== -->
  <body>
    <div id="container">
      <div class="main">
        <div id="header1">
          <div id="logo1"><img src="logo4p.png" /></div>

          <div class="title1">General forms</div>
          <div class="form1">
            Build, design, and translate sign up forms and response emails
          </div>

          <div id="but1"><button>Select</button></div>
        </div>
      </div>
