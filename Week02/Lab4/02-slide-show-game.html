<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Show Game</title>
    <style>
      #container {
        /* background-color: aqua; */
        width: 900px;
        height: 700px;
        text-align: center;
        margin: 50px auto;
        position: relative;
      }

      #header {
        font-family: sans-serif;
        border: 2px solid yellow;
        width: 40%;
        margin: 10px auto;
        font-weight: 100;
      }

      span {
        color: rgb(0, 200, 255);
      }

      img {
        width: 700px;
        height: 500px;
        margin: 20px;
        border: 10px solid yellow;
      }

      button {
        color: white;
        background-color: rgb(225, 177, 2);
        border: none;
        width: 60px;
        height: 50px;
      }

      #lef {
        position: absolute;
        left: 10%;
        bottom: 5%;
      }

      #rig {
        position: absolute;
        right: 10%;
        bottom: 5%;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div>
        <h1 id="header"><span>Slide Show</span> Game</h1>
      </div>
      <div>
        <img src="https://picsum.photos/id/15/700/500" alt="slids" id="slids" />
      </div>
      <div>
        <button id="lef"><</button>
        <button id="rig">></button>
      </div>
    </div>
    <script>
      var imgs = [
        "https://picsum.photos/id/10/700/500",
        "https://picsum.photos/id/15/700/500",
        "https://picsum.photos/id/50/700/500",
        "https://picsum.photos/id/19/700/500",
        "https://picsum.photos/id/12/700/500",
        "https://picsum.photos/id/13/700/500",
        "https://picsum.photos/id/20/700/500",
        "https://picsum.photos/id/70/700/500",
      ];
      slids = document.getElementById("slids");
      leftside = document.querySelector("#lef");
      rightside = document.querySelector("#rig");

      var currimgs = 0;

      leftside.addEventListener("click", function () {
        currimgs = (currimgs - 1 + imgs.length) % imgs.length;
        slids.src = imgs[currimgs];
      });

      rightside.addEventListener("click", function () {
        currimgs = (currimgs + 1) % imgs.length;
        slids.src = imgs[currimgs];
      });
    </script>
  </body>
</html>
