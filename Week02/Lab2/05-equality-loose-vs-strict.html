<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var strNum = "100";
      var Num = 100;
      console.log(
        strNum == Num,
        "true --> because (==) is (Loose Equality) Compares values only, Converts types if needed ",
      );
      console.log(
        strNum === Num,
        "fasle --> because (===) is (Strict Equality) Compares values only, No type conversion",
      );
    </script>
  </body>
</html>
