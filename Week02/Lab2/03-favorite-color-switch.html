<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var userColor = prompt("Enter your favorite color: ");
      switch (userColor.trim().toLowerCase()) {
        case "blue":
          alert("Cool and calm choice!");
          break;

        case "red":
          alert("Bold and passionate!");
          break;

        case "green":
          alert("Fresh and lively!");
          break;
        default:
          alert("Interesting color!");
      }
    </script>
  </body>
</html>
