<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var userPass = prompt("Enter your password: ");
      var upplet = false;
      var num = false;
      var isLong = userPass.length >= 8;

      for (var i = 0; i < userPass.length; i++) {
        var char = userPass[i];
        if (char >= "0" && char <= "9") {
          num = true;
        }
        if (char >= "A" && char <= "Z") {
          upplet = true;
        }
      }

      if (isLong && num && upplet) {
        alert("Strong password");
      } else {
        alert("Weak password");
      }
    </script>
  </body>
</html>
