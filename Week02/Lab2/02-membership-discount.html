<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var member = prompt("Are you a member(yes or no)? : ");
      // var originalValue = Number(prompt("Enter the value of product: ")); // لو عاوزين المستخدم هو اللي يقول القيمه
      var originalValue = 200;
      var checkIsmember = member.trim().toLowerCase() === "yes" ? 0.25 : 0.1;
      var finalValue = originalValue - originalValue * checkIsmember;
      alert("Final Price = " + finalValue);
    </script>
  </body>
</html>
