<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var number = Number(prompt("Enter your number: "));

      console.log("US format: " + number.toLocaleString("en-US"));
      console.log("AR format: " + number.toLocaleString("ar-EG"));
      console.log("In format: " + number.toLocaleString("en-IN"));
      console.log("Ge format: " + number.toLocaleString("de-DE"));
    </script>
  </body>
</html>
